# E23: Fhyb6 with the translator changed to Gemini 3.8 Flash (medium thinking) through agy.
# Checker (big-pickle), Opus hard lines and review escalation as Fhyb6. Euphoria only, first try.
llm:
  backend: opencode
  opencode_model: opencode/big-pickle
  timeout_s: 1200
  cache_dir: null
style_rules: true
translate:
  chunk_size: 300
  llm: {backend: agy, agy_model: gemini-3.8-flash-medium, timeout_s: 1800}
glossary:
  enabled: true
hard_lines:
  enabled: true
  select_also_hard: true
  llm: {backend: claude, claude_model: claude-opus-5-5, claude_effort: medium, claude_tools: WebSearch, timeout_s: 1800}
correction:
  llm: null
review_pass:
  enabled: true
  min_sev: 2
  batch: 75
  escalate: true
