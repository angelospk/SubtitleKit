# E25: Fhyb8 (Gemini 3.8 Flash low via agy) + film_context from the E24 plot.md (no web search), chunk_size 300.
# Checker big-pickle, Opus hard lines, review escalation as Fhyb8. 3 films.
llm:
  backend: opencode
  opencode_model: opencode/big-pickle
  timeout_s: 1200
  cache_dir: null
style_rules: true
translate:
  chunk_size: 300
  llm: {backend: agy, agy_model: gemini-3.8-flash-low, timeout_s: 300}
glossary:
  enabled: true
hard_lines:
  enabled: true
  select_also_hard: true
  llm: {backend: claude, claude_model: claude-opus-5-5, claude_effort: medium, claude_tools: WebSearch, timeout_s: 1800}
correction:
  llm: null
review_pass:
  enabled: true
  min_sev: 2
  batch: 75
  escalate: true
film_context:
  enabled: true
