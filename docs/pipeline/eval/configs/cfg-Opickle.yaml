# E12: free OpenCode translator (opencode/big-pickle), Opus 5.5 medium corrector + gpt-6.1-sol review pass; rest as Lopus3.
llm:
  backend: claude
  claude_model: claude-haiku-5-5
  timeout_s: 900
  cache_dir: null
style_rules: true
translate:
  chunk_size: 300
  llm: {backend: opencode, opencode_model: opencode/big-pickle, timeout_s: 1200}
glossary:
  enabled: true
hard_lines:
  enabled: true
  llm: {backend: claude, claude_model: claude-sonnet-5-5, claude_tools: WebSearch, timeout_s: 1800}
correction:
  llm: {backend: claude, claude_model: claude-opus-5-5, claude_effort: medium, timeout_s: 1800}
review_pass:
  enabled: true
  min_sev: 3
  batch: 75
  llm: {backend: bridge, bridge_model: gpt-6.1-sol, bridge_effort: medium, timeout_s: 2400}
