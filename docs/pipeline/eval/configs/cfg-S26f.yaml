# E26f: S26e + swearing at the strength of the source in STYLE_EL and the harold correction lines (E26e Euphoria: 5 of 12 noticeable were stronger swearing).
# E26e: S26d + correction.passes 2 + any fix may grow to the 17 CPS budget (E26 Kumail: 11 of 27 pass-2 rejections were length only).
# E26d: S26c with gpt-6.1-sol high (agent-bridge) as the corrector (E26 A/B: Euphoria noticeable 14.1 -> 7.0 vs Opus medium).
# E26c: S26b + translate.anchor (each Greek cue starts with its first 2 source words; code checks and strips them).
# E26b: S26 + correction.meaning_fix (a meaning fix may grow to the 17 CPS budget) + retries with 3 neighbours.
# E26: the simple pipeline (Harold's review, 2026-10-17). Gemini 3.8 Flash low (agy) translates SRT text in
# 500-cue chunks with Harold's Greek prompt (prompts_el.py), no CPS budget and no condensing; the shift detector
# (shift.py) asks a shifted block again. Captions go into the source before translation. Opus corrects with
# Harold's Greek rx/sb prompt. No fidelity check, hard lines or review pass; timing is code only.
llm:
  backend: claude
  claude_model: claude-opus-5-5
  claude_effort: medium
  timeout_s: 1800
  cache_dir: null
style_rules: true
translate:
  format: srt
  anchor: true
  chunk_size: 500
  budget_cps: null
  llm: {backend: agy, agy_model: gemini-3.8-flash-low, timeout_s: 480}
glossary:
  enabled: true
correction:
  enabled: true
  prompt: harold
  meaning_fix: true
  passes: 2
  llm: {backend: bridge, bridge_model: gpt-6.1-sol, bridge_effort: high, timeout_s: 2400}
captions:
  before_translation: true
film_context:
  enabled: true
  # New films have no plot.md: Sonnet + WebSearch finds the published plot (as cfg-Lplot).
  llm: {backend: claude, claude_model: claude-sonnet-5-5, claude_tools: WebSearch, timeout_s: 900}
fixes:
  condense_above_cps: 999
review:
  translation_fidelity: "none"
