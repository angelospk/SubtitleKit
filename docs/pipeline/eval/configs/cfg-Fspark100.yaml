# E15b: E14a (all free: spark translates, pickle checks) with chunk 100.
# hard lines and review pass on big-pickle, so another model checks the translator. Rest as Lopus3.
llm:
  backend: opencode
  opencode_model: opencode/big-pickle
  timeout_s: 1200
  cache_dir: null
style_rules: true
translate:
  chunk_size: 100
  llm: {backend: opencode, opencode_model: opencode/muse-spark-1.3-contributor-free, timeout_s: 1200}
glossary:
  enabled: true
hard_lines:
  enabled: true
correction:
  llm: null
review_pass:
  enabled: true
  min_sev: 3
  batch: 75
